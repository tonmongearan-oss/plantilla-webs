<div class="topbar-info">
  <div class="wrap">
    <span class="hide-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span><span data-center="address">{{negocio.direccion}}</span></span></span>
    <span class="hide-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-center="publicHours">{{negocio.horario}}</span></span>

    {{demoFlag}}
    <a href="tel:{{telHref}}" data-tel><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg><span data-center="phone">{{negocio.telefono}}</span></a>

</div>
<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo" aria-label="{{negocio.nombre}}, inicio"><span class="logo-img" role="img" aria-label="{{negocio.nombreCorto}}"></span><span class="logo-txt">{{negocio.nombreCorto}}</span></a>
    <nav class="nav" aria-label="Principal">
      {{nav}}
    </nav>

      <a class="btn btn-brand btn-sm" href="reservar.html" data-nav="reservar">{{ctaReservar}}</a>

    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" hidden aria-label="Menú">
